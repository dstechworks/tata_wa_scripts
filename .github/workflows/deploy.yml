name: Deploy to Server

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Setup SSH for GitHub (Account SSH Key)
      - name: Setup GitHub SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      # 1️⃣a Debug SSH to GitHub
      - name: Debug SSH to GitHub
        run: ssh -i ~/.ssh/id_ed25519 -T git@github.com

      # 2️⃣ Checkout current private repo using SSH key
      - name: Checkout Current Repo
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 3️⃣ Optional: Checkout additional private repo(s)
      # - name: Checkout Another Repo
      #   uses: actions/checkout@v4
      #   with:
      #     ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     repository: hiteshtechworks/another-private-repo
      #     path: another-repo

      # 4️⃣ Setup SSH for server
      - name: Setup Server SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_server
          chmod 600 ~/.ssh/id_server
          ssh-keyscan -H 165.22.218.65 >> ~/.ssh/known_hosts

      # 5️⃣ Run deploy script on server
      - name: Deploy to Server
        run: |
          ssh -i ~/.ssh/id_server -o StrictHostKeyChecking=no root@165.22.218.65 'bash -s' < ./deploy.sh
